name: Release build

# Builds the SIGNED release APK and publishes it as a GitHub Release with stable file names, so a fixed link
# (releases/latest/download/ExtendedFileManager.apk) always serves the newest build - this is what the
# OS APPs & Downs store links to. Run it by hand (Actions -> Release build -> Run workflow) or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publishes the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key (required)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing: refusing to build an unsigned or wrongly signed release. See CLAUDE.md (Release process)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests and signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          META=app/build/outputs/apk/release/output-metadata.json
          VER=$(python3 -c "import json;print(json.load(open('$META'))['elements'][0]['versionName'])")
          CODE=$(python3 -c "import json;print(json.load(open('$META'))['elements'][0]['versionCode'])")
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          case "$APK" in *unsigned*) echo "::error::The release APK is unsigned"; exit 1;; esac
          TAG="v${VER}-b${CODE}"
          cp "$APK" "$RUNNER_TEMP/ExtendedFileManager-${VER}-b${CODE}.apk"
          cp "$APK" "$RUNNER_TEMP/ExtendedFileManager.apk"
          (cd "$RUNNER_TEMP" && sha256sum ExtendedFileManager.apk > ExtendedFileManager.apk.sha256)
          FILES=("$RUNNER_TEMP/ExtendedFileManager-${VER}-b${CODE}.apk" "$RUNNER_TEMP/ExtendedFileManager.apk" "$RUNNER_TEMP/ExtendedFileManager.apk.sha256")
          awk -v v="## v${VER}" 'index($0,v)==1{f=1;next} /^## /{f=0} f' docs/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "Extended File Manager ${VER}" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "Extended File Manager ${VER}" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # the Release above is the durable copy; the artifact quota may be full
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
