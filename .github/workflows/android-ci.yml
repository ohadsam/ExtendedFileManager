name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Dependency Graph submission (below) needs write access to report the
    # project's dependencies to GitHub -- read-only for every other step,
    # narrowed here rather than raised for the whole workflow.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Submits this build's resolved dependencies to GitHub's Dependency
      # Graph, which is what turns on Dependabot vulnerability alerts for
      # this project -- no extra tool, network call, or secret needed. A
      # fork pull_request run has no write token regardless of what's
      # requested above, so this step degrades to a no-op there rather
      # than failing the job.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: generate-and-submit

      - name: Ktlint check
        run: ./gradlew ktlintCheck

      - name: Detekt
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Phase 20: coverage report only, not a pass/fail gate yet -- see app/build.gradle.kts'
      # own testCoverage comment for why a threshold isn't enforced in this slice.
      - name: Unit test coverage report
        run: ./gradlew createDebugUnitTestCoverageReport

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Assemble release APK (R8/ProGuard)
        run: ./gradlew assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/reports/ktlint
            app/build/reports/detekt
            app/build/reports/lint-results-debug.html
            app/build/reports/coverage
          retention-days: 14

      - name: Upload R8/ProGuard mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: app/build/outputs/mapping/release
          retention-days: 14
          if-no-files-found: ignore
